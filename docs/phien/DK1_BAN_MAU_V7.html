<script>
"use strict";
const PH=['Chuẩn bị','GV đăng ký','Duyệt CLB','HS đăng ký','Nhập điểm','Xuất'];
const KEY='dk1_state_v1', ADMIN_PW='admin123', MAX_NV=10, MAX_TEST=5;
const IDLE={hs:60,gv:120,admin:120};
let S=null;
const V={screen:'home',tab:'bayGio',sub:{},authed:false,gv:{mode:'login',user:null,edit:null,draft:null,err:[]},hs:{step:'login',user:null,draft:null,tab:null,err:''},lastAct:Date.now(),modal:null,toast:null,tmp:{}};

/* ---------- utils ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const fmt=ts=>{if(!ts)return '—';const d=new Date(ts);return `${p2(d.getDate())}/${p2(d.getMonth()+1)} ${p2(d.getHours())}:${p2(d.getMinutes())}`};
const toInput=ts=>{const d=new Date(ts);return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`};
const fromInput=v=>{const t=new Date(v).getTime();return isNaN(t)?null:t};
const norm=s=>String(s||'').normalize('NFC').trim().replace(/\s+/g,' ').toLowerCase();
function remain(ts){const ms=ts-Date.now();if(ms<=0)return 'đã hết hạn';const m=Math.round(ms/60000);if(m<60)return `còn ${m} phút`;const h=Math.floor(m/60);if(h<48)return `còn ${h} giờ ${m%60} phút`;return `còn ${Math.floor(h/24)} ngày`}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function parseScore(v){const s=String(v??'').trim().replace(',','.');if(!/^\d+(\.\d+)?$/.test(s))return null;return Number(s)}
const showScore=n=>n==null?'':String(n).replace('.',',');
function gradeOf(lop){const m=String(lop||'').trim().match(/^(\d{1,2})/);if(!m)return null;const g=Number(m[1]);return S.grades.includes(g)?g:null}

/* ---------- state ---------- */
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const t=localStorage.getItem(KEY);if(t){const o=JSON.parse(t);if(o&&o.v===2){S=o;return}}}catch(e){}seed('nho')}
function log(who,msg){S.log.unshift({ts:Date.now(),who,msg});if(S.log.length>400)S.log.length=400}
const HO=['Nguyễn','Trần','Lê','Phạm','Hoàng','Huỳnh','Phan','Vũ','Võ','Đặng','Bùi','Đỗ','Hồ','Ngô','Dương','Lý'];
const DEM=['Văn','Thị','Minh','Ngọc','Gia','Quang','Thanh','Bảo','Đức','Khánh','Hoài','Anh','Thu','Hữu','Phương'];
const TEN=['An','Bình','Châu','Dũng','Giang','Hà','Hải','Hân','Hiếu','Hoa','Huy','Khang','Khoa','Lan','Linh','Long','Mai','My','Nam','Ngân','Nhi','Phúc','Quân','Quỳnh','Sơn','Tâm','Thảo','Thư','Trang','Trí','Trung','Tú','Vy','Yến'];
const CLBN=['Bóng rổ','Cờ vua','Robotics','Guitar','Hội hoạ','Khoa học Lên men','Toán Sáng tạo','MC & Thuyết trình','Bóng đá','Bóng bàn','Nấu ăn','In 3D','Kịch Lịch sử','Origami','Dance Workout','Canva','Nhiếp ảnh','Tiếng Anh Tranh biện','Lập trình Python','Thiên văn','Văn học Trẻ','Hợp xướng','Cầu lông','Bơi','Sân khấu','Mô phỏng Liên Hợp Quốc','Làm Xà phòng','Trồng cây','Báo chí','E-Sports','Vẽ truyện tranh','Hoá học Vui','Vật lý Makers','Sinh học Thực địa','Lịch sử Địa phương','Kinh tế Trẻ','Võ thuật','Yoga','Tô màu Chánh niệm','Kỹ sư Máy bay Giấy'];
function seed(kind){
  const r=rng(kind==='ca'?2026:11), pick=a=>a[Math.floor(r()*a.length)], pin=()=>String(Math.floor(r()*10000)).padStart(4,'0');
  const big=kind==='ca';
  const sessions=['Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6'].map((n,i)=>({id:'B'+(i+1),name:n}));
  let rooms=[['P101',30],['P102',30],['P201',35],['Lab Hoá',20],['Lab Tin',25],['Sân bóng',40],['Thư viện',20],['Phòng nhạc',12]];
  if(big)rooms=rooms.concat([['P103',30],['P104',30],['P202',35],['P203',35],['Phòng múa',25],['Nhà đa năng',45]]);
  rooms=rooms.map((x,i)=>({id:'R'+(i+1),name:x[0],cap:x[1]}));
  const students=[];let n=0;
  const classes=big?[6,7,8,9,10,11,12].flatMap(g=>[1,2,3].map(k=>`${g}A${k}`)):['6A1','7A1','8A1','9A1','10A1'];
  const per=big?38:6;
  const usedNames=new Set();
  for(const c of classes)for(let i=0;i<per;i++){n++;let nm;do{nm=`${pick(HO)} ${pick(DEM)} ${pick(TEN)}`}while(usedNames.has(nm)&&usedNames.size<4000);usedNames.add(nm);
    students.push({id:'HS'+String(n).padStart(big?4:3,'0'),name:nm,lop:c,khoi:Number(c.match(/^\d+/)[0]),pin:pin()})}
  const T=big?25:6, teachers=[];
  for(let i=0;i<T;i++)teachers.push({id:'GV'+String(i+1).padStart(2,'0'),name:`${pick(['Cô','Thầy'])} ${pick(HO)} ${pick(TEN)}`,pin:pin(),ts:Date.now()});
  const NC=big?40:10, clubs=[], perSess={};
  for(let k=0;k<NC;k++){
    const sess=sessions[k%5], j=perSess[sess.id]=(perSess[sess.id]||0); perSess[sess.id]++;
    const room=rooms[(j*3+k%5)%rooms.length];
    const lo=6+Math.floor(r()*4), hi=Math.min(12,lo+2+Math.floor(r()*4));
    const grades=[];for(let g=lo;g<=hi;g++)grades.push(g);
    const loai=j===0?'tudo':(j%2?'tuyen':'gioihan'), hasTest=loai==='tuyen', id='CLB'+String(k+1).padStart(3,'0');
    clubs.push({id,name:'CLB '+CLBN[k%CLBN.length],teacherId:teachers[(k+Math.floor(k/25))%T].id,sessionId:sess.id,roomId:room.id,
      quota:Math.min(room.cap,10+Math.floor(r()*21)),adminQuota:null,grades,loai,diemSan:hasTest?4+Math.floor(r()*3):null,hasTest,link:hasTest?`https://forms.gle/demo-${id.toLowerCase()}`:'',
      desc:'Sinh hoạt hằng tuần, có sản phẩm cuối kỳ.',req:r()<0.5?'Không':'Biết kiến thức cơ bản về '+CLBN[k%CLBN.length].toLowerCase(),status:'cho',ts:Date.now()});
  }
  S={v:2,dataset:kind,phase:1,deadline:{1:Date.now()+2*864e5},sessions,grades:[6,7,8,9,10,11,12],rooms,students,teachers,clubs,
    schoolCode:'TRUONG2026',regs:{},scores:{},exportVer:0,nextClub:NC+1,nextTeacher:T+1,lastBackup:Date.now(),log:[]};
  log('Hệ thống',`Nạp dữ liệu mẫu "${big?'Cả trường':'Demo nhỏ'}": ${students.length} HS, ${clubs.length} CLB, ${rooms.length} phòng. Đang ở giai đoạn GV đăng ký.`);
  save();
}
const club=id=>S.clubs.find(c=>c.id===id);
const LOAI={tudo:'Tự do',gioihan:'Giới hạn',tuyen:'Tuyển chọn'};
const isFree=c=>!!c&&c.loai==='tudo';
function loaiChip(c){return c.loai==='tudo'?'<span class="chip on">Tự do tham gia – em chắc chắn có chỗ</span>':c.loai==='tuyen'?`<span class="chip wait">Tuyển chọn – ${eq(c)} chỗ – có kiểm tra đầu vào. Dưới mốc ${c.diemSan} điểm sẽ không được xét</span>`:`<span class="chip">Giới hạn ${eq(c)} chỗ – không kiểm tra; nếu đông, xét huy chương rồi bốc thăm</span>`}
const MEDALS=[['vang','Vàng',60],['bac','Bạc',30],['dong','Đồng',10]];
function defaultMedals(pr){const nf=pr.filter(id=>club(id)&&!isFree(club(id)));return {vang:nf[0]||null,bac:nf[1]||null,dong:nf[2]||null}}
function medalsOf(d,sid){const pr=(d.prefs&&d.prefs[sid])||[];const m=d.medalSet&&d.medalSet[sid]&&d.medals&&d.medals[sid]?{...d.medals[sid]}:defaultMedals(pr);for(const k in m)if(m[k]&&(!pr.includes(m[k])||isFree(club(m[k]))))m[k]=null;return m}
function medalOfClub(d,sid,cid){const m=medalsOf(d,sid);return Object.keys(m).find(k=>m[k]===cid)||null}
const medalName=k=>k?MEDALS.find(m=>m[0]===k)[1]:'';
function mix(a,b){let h=2166136261;for(const ch of a+'|'+b){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const room=id=>S.rooms.find(r=>r.id===id);
const sess=id=>S.sessions.find(s=>s.id===id);
const teacher=id=>S.teachers.find(t=>t.id===id);
const eq=c=>c.adminQuota??c.quota;
const live=c=>c.status!=='tuchoi';
function roomTaken(roomId,sessId,except){return S.clubs.find(c=>live(c)&&c.id!==except&&c.roomId===roomId&&c.sessionId===sessId)}
function choosers(clubId){let n=0;for(const k in S.regs){const g=S.regs[k];if(Object.values(g.prefs).some(a=>a.includes(clubId)))n++}return n}
function dropClubFromRegs(clubId){let n=0;for(const k in S.regs){const g=S.regs[k];let hit=false;for(const s in g.prefs){const i=g.prefs[s].indexOf(clubId);if(i>=0){g.prefs[s].splice(i,1);hit=true}}g.tests=g.tests.filter(x=>x!==clubId);if(hit)n++}delete S.scores[clubId];return n}

/* ---------- phase engine ---------- */
function tick(){
  if(!S)return;let changed=false;
  if((S.phase===1||S.phase===3)&&S.deadline[S.phase]&&Date.now()>=S.deadline[S.phase]){
    const from=S.phase;S.phase=from+1;log('Hệ thống',`Hết hạn: tự đóng "${PH[from]}" → chuyển sang "${PH[S.phase]}".`);changed=true;
  }
  if(changed){save();if(V.screen==='hs'&&V.hs.user&&S.phase!==3&&V.hs.step!=='receipt'){V.hs.step='closed'}render()}
}
function setPhase(p,who,why){const from=S.phase;S.phase=p;log(who,`${why}: "${PH[from]}" → "${PH[p]}".`);save()}

/* ---------- UI helpers ---------- */
function toast(m){V.toast=m;renderOverlay();clearTimeout(V.tt);V.tt=setTimeout(()=>{V.toast=null;renderOverlay()},3200)}
function ask(title,body,yes,onYes,danger){V.modal={title,body,yes,danger};V.onYes=onYes;renderOverlay()}

function copyText(id){const el=$(id);if(!el)return;const t=el.value;
  const fb=()=>{el.hidden=false;el.focus();el.select();toast('Đã chọn sẵn chữ, bấm Ctrl+C để chép.')};
  try{navigator.clipboard.writeText(t).then(()=>toast('Đã chép vào bộ nhớ tạm.'),fb)}catch(e){fb()}}
function phaseChip(role){ // role: gv|hs
  const open=role==='gv'?S.phase===1:S.phase===3, before=role==='gv'?S.phase<1:S.phase<3;
  if(open)return `<span class="chip on">Đang mở · ${remain(S.deadline[S.phase])}</span>`;
  return before?`<span class="chip wait">Chưa mở</span>`:`<span class="chip off">Đã đóng</span>`;
}

/* ---------- render ---------- */
let ptrDown=false, deferRender=false, pendingRender=false, rendering=false;
function render(){
  if(deferRender||rendering){pendingRender=true;return}

}
function focusKey(a){if(!a||!a.closest||!a.closest('#app'))return null;if(a.id)return '#'+a.id;if(!a.dataset.chg)return null;
  return `[data-chg="${a.dataset.chg}"]`+['id','c','s','m'].map(k=>a.dataset[k]?`[data-${k}="${a.dataset[k]}"]`:'').join('')}
function renderNow(){const fk=focusKey(document.activeElement);_renderNow();if(fk){const el=document.querySelector('#app '+fk);if(el){el.focus();if(el.select&&el.tagName==='INPUT')el.select()}}}
function _renderNow(){

    <span class="idle" id="idle" aria-live="polite"></span>

function splitStudentLine(l){
  let c=l.split('\t').map(x=>x.trim()).filter(Boolean);if(c.length>=3)return c;
  c=l.split(/[;,]/).map(x=>x.trim()).filter(Boolean);if(c.length>=3)return c;
  const w=l.split(/\s+/).filter(Boolean);if(w.length<3)return w;   // "HS6969 Nguyễn Cường 7A8": mã đầu, lớp cuối, giữa là họ tên
  let kh=null;if(w.length>=4&&/^\d{1,2}$/.test(w[w.length-1])&&/^\d{1,2}\D/.test(w[w.length-2]))kh=w.pop();
  const lop=w.pop(), id=w.shift();return kh?[id,w.join(' '),lop,kh]:[id,w.join(' '),lop];
}
function parseStudentText(txt){
  const lines=txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);const rows=[],seen=new Set(),have=new Set(S.students.map(s=>s.id.toUpperCase()));
  lines.forEach((l,i)=>{const c=splitStudentLine(l);
    if(i===0&&c[0]&&/^(m[ãa]|id|stt|h[ọo])/i.test(c[0])&&!/\d/.test(c[0]))return;
    const [id,name,lop,kh]=c;const r={id:id||'',name:name||'',lop:lop||'',line:i+1,err:[]};
    r.khoi=kh?Number(kh):gradeOf(lop);
    if(!id)r.err.push('thiếu mã học sinh ở đầu dòng');
    if(!name)r.err.push('thiếu họ tên (nằm giữa mã và lớp)');
    if(!lop)r.err.push('thiếu lớp ở cuối dòng, ví dụ 7A8');
    else if(!/^\d/.test(lop))r.err.push(`không thấy lớp ở cuối dòng ("${lop}" không phải tên lớp; ví dụ 7A8)`);
    else if(!r.khoi||!S.grades.includes(r.khoi))r.err.push(`lớp "${lop}" không bắt đầu bằng khối ${S.grades[0]}–${S.grades[S.grades.length-1]}`);
    const U=r.id.toUpperCase();if(id&&seen.has(U))r.err.push('mã trùng với một dòng phía trên');if(id)seen.add(U);
    r.kind=r.err.length?'loi':have.has(U)?'capnhat':'moi';
    r.lopMoi=!!lop&&!S.students.some(s=>s.lop===lop);rows.push(r)});
  return {rows,errs:rows.filter(r=>r.kind==='loi')};
}

function readGvForm(){const d=V.gv.draft, has=id=>!!$(id), v=id=>$(id).value;

  if(document.querySelector('.f_gr'))d.grades=[...document.querySelectorAll('.f_gr:checked')].map(x=>Number(x.value));
  if(d.roomId&&roomTaken(d.roomId,d.sessionId,V.gv.edit==='new'?null:V.gv.edit))d.roomId='';}
function validateClub(d,editId){const e=[];const nm=norm(d.name), E=(st,m)=>e.push({st,m});
  if(!nm)E(1,'Nhập tên CLB.');else if(S.clubs.some(c=>c.id!==editId&&norm(c.name)===nm))E(1,'Tên CLB đã có. Đặt tên khác, ví dụ thêm buổi vào tên.');
  if(!sess(d.sessionId))E(1,'Chọn buổi.');
  if(S.clubs.some(c=>live(c)&&c.id!==editId&&c.teacherId===V.gv.user&&c.sessionId===d.sessionId))E(1,'Thầy cô đã có một CLB ở buổi này.');
  const r=room(d.roomId);if(!r)E(1,'Chọn phòng.');else if(roomTaken(r.id,d.sessionId,editId))E(1,'Phòng này đã có CLB khác ở buổi đó.');
  if(d.loai!=='tudo'){const q=Number(d.quota);if(!/^\d+$/.test(String(d.quota).trim())||q<1)E(1,'Số học sinh nhận phải là số nguyên từ 1.');else if(r&&q>r.cap)E(1,`Số học sinh nhận (${q}) lớn hơn sức chứa phòng ${esc(r.name)} (${r.cap}). Giảm số hoặc chọn phòng lớn hơn.`);}
  if(!d.grades.length)E(2,'Chọn khối được tham gia.');
  if(d.hasTest&&!/^https?:\/\/\S+/.test(d.link.trim()))E(2,'CLB Tuyển chọn cần link bài kiểm tra Google Forms (bắt đầu bằng https://).');
  if(d.loai==='tuyen'&&!(/^\d+$/.test(String(d.san).trim())&&Number(d.san)<=10))E(2,'Điểm sàn là số nguyên từ 0 đến 10.');
  return e;}

function hsSteps(cur){const L=[['rank','1. Xếp nguyện vọng'],['medals','2. Đặt huy chương'],['tests','3. Bài kiểm tra'],['review','4. Xem lại và gửi']];return `<div class="steps">${L.map(([k,l])=>`<span class="${k===cur?'cur':''}">${l}</span>`).join('')}</div>`}
function hsView(){
  const h=V.hs;
  if(!h.user){if(S.phase!==3)return narrow(closedPanel('Học sinh',S.phase<3?'Chưa mở đăng ký cho học sinh. Em quay lại khi thầy cô thông báo.':'Đã hết hạn đăng ký. Nguyện vọng em đã gửi vẫn được tính.'));

     <label>PIN (trên phiếu thầy cô phát)<input id="h_pin" type="password" class="mono" inputmode="numeric" maxlength="4" required autocomplete="off"></label>
     ${h.err?`<div class="err">${h.err}</div>`:''}<button class="pri">Đăng nhập</button></form>
     <p class="small muted">Không có tên trong danh sách hoặc quên PIN thì báo thầy cô quản lý. Máy tự thoát sau 60 giây không thao tác.</p></section>`)}
  const st=stu();

  if(h.step==='confirm')return `<section class="panel narrow"><h2>Đúng là em chứ?</h2><div class="big">${esc(st.name)}</div><p>Lớp <b>${esc(st.lop)}</b> · Khối <b>${st.khoi}</b> · Mã <span class="mono">${st.id}</span></p>
    ${S.regs[st.id]?`<p class="note">Em đã gửi lúc ${fmt(S.regs[st.id].ts)}. Em có thể sửa rồi gửi lại; lần gửi cuối cùng được tính.</p>`:''}
    <div class="row"><button class="pri" data-act="hsYes">Đúng là em</button><button data-act="logout">Không phải em</button></div></section>`;
  if(h.step==='rank'){const tab=h.tab||S.sessions[0].id, pr=h.draft.prefs[tab]||[], el=eligible(st,tab).filter(c=>!pr.includes(c.id)).sort((a,b)=>mix(st.id,a.id)-mix(st.id,b.id)), full=pr.length>=MAX_NV;
    return `${hsSteps('rank')}<div class="row"><h1 style="flex:1">Xếp nguyện vọng</h1></div>
     <p class="muted">Xếp đúng thứ tự em thích. Xếp CLB khó vào lên đầu không làm em mất cơ hội ở CLB sau. Mỗi buổi tối đa ${MAX_NV} CLB, em vào nhiều nhất một CLB; buổi để trống là em không học buổi đó.</p>
     ${pr.length&&!pr.some(id=>isFree(club(id)))&&eligible(st,tab).some(isFree)?'<p class="note">Thêm một CLB Tự do để chắc chắn có chỗ ở buổi này.</p>':''}
     <nav class="tabs" aria-label="Buổi">${S.sessions.map(s=>`<button class="${s.id===tab?'cur':''}" data-act="hsTab" data-id="${s.id}">${esc(s.name)}<span class="cnt">${(h.draft.prefs[s.id]||[]).length}</span></button>`).join('')}</nav>
     <div class="split"><section class="panel"><h2>CLB cho khối ${st.khoi} · ${esc(sess(tab)?.name)}</h2>
      ${el.length?`<div class="cards">${el.map(c=>`<div class="card"><div class="body"><span class="name">${esc(c.name)}</span><span>${loaiChip(c)}</span>
       <span class="small muted">${esc(teacher(c.teacherId)?.name)} · ${esc(room(c.roomId)?.name)} · khối ${c.grades.join(', ')}</span><span class="small">${esc(c.desc)}</span>${c.req&&norm(c.req)!=='không'?`<span class="small"><b>Yêu cầu:</b> ${esc(c.req)}</span>`:''}</div>
       <button class="sm" data-act="hsAdd" data-id="${c.id}" ${full?'disabled':''}>+ Thêm</button></div>`).join('')}</div>`:`<div class="empty">${eligible(st,tab).length?'Em đã thêm hết CLB của buổi này.':'Buổi này không có CLB nào cho khối của em.'}</div>`}</section>
     <section class="panel"><h2>Nguyện vọng ${esc(sess(tab)?.name)} <span class="muted num">${pr.length}/${MAX_NV}</span></h2>
      ${pr.length?`<ol class="rank">${pr.map((id,i)=>`<li><span class="nv">NV${i+1}</span><span class="nm">${esc(club(id)?.name)}<span class="small muted"> · ${LOAI[club(id)?.loai]}</span></span><button class="sm" data-act="hsMove" data-id="${id}" data-d="-1" ${i===0?'disabled':''} aria-label="Lên">↑</button><button class="sm" data-act="hsMove" data-id="${id}" data-d="1" ${i===pr.length-1?'disabled':''} aria-label="Xuống">↓</button><button class="sm" data-act="hsRm" data-id="${id}" aria-label="Bỏ">✕</button></li>`).join('')}</ol>`:'<div class="empty">Chưa chọn. Bấm "Thêm" ở bên cạnh.</div>'}
      ${full?`<p class="small muted">Đã đủ ${MAX_NV} nguyện vọng cho buổi này.</p>`:''}</section></div>
     <div class="row"><button class="pri" data-act="hsStep" data-s="medals">Tiếp: đặt huy chương</button></div>`}
  if(h.step==='medals'){const need=S.sessions.filter(s=>(h.draft.prefs[s.id]||[]).some(id=>!isFree(club(id))));
    const tab=need.some(s=>s.id===h.tab)?h.tab:need[0]?.id;
    let body='<div class="panel"><div class="empty">Nguyện vọng của em chỉ có CLB Tự do (luôn có chỗ), nên không cần huy chương. Em bấm tiếp.</div></div>';
    if(tab){const m=medalsOf(h.draft,tab), pr=h.draft.prefs[tab], opts=pr.filter(id=>!isFree(club(id))), manual=h.draft.medalSet?.[tab];
      body=`<nav class="tabs" aria-label="Buổi">${need.map(s=>`<button class="${s.id===tab?'cur':''}" data-act="hsTab" data-id="${s.id}">${esc(s.name)}</button>`).join('')}</nav>
      <section class="panel"><div class="row" style="align-items:center"><h2 style="flex:1">${esc(sess(tab).name)}</h2>${manual?'<button class="sm" data-act="hsMedalReset" data-s="'+tab+'">Đặt lại theo nguyện vọng</button>':'<span class="chip">Đang đặt theo thứ tự nguyện vọng</span>'}</div>
      ${manual?'<p class="small muted">Em đã tự đổi huy chương buổi này. Đổi thứ tự nguyện vọng sẽ không làm huy chương đổi theo.</p>':''}
      <div class="medals">${MEDALS.map(([k,l,p])=>`<label class="medal m-${k}"><span class="mname"><span class="dot" aria-hidden="true"></span><b>${l}</b><span class="small muted">${p} điểm</span></span><select data-chg="hsMedal" data-s="${tab}" data-m="${k}" aria-label="Huy chương ${l}"><option value="">Không đặt</option>${opts.map(id=>`<option value="${id}" ${m[k]===id?'selected':''}>NV${pr.indexOf(id)+1} · ${esc(club(id).name)}</option>`).join('')}</select></label>`).join('')}</div>
      ${Object.values(m).some(id=>id&&club(id).loai==='tuyen')?'<p class="note">Huy chương ở CLB Tuyển chọn chỉ dùng khi bằng điểm, và chỉ khi em vượt mốc.</p>':''}</section>`}
    return `${hsSteps('medals')}<h1>Đặt huy chương</h1><p class="muted">Mỗi buổi em có một huy chương Vàng, một Bạc, một Đồng. Khi CLB có nhiều bạn muốn vào hơn số chỗ, huy chương giúp em được ưu tiên: Vàng mạnh nhất. Mỗi CLB nhận tối đa một huy chương. CLB Tự do luôn có chỗ nên không cần huy chương.</p>
     <p class="note">Đã đặt sẵn theo thứ tự nguyện vọng. Em đổi nếu muốn dồn huy chương cho CLB khác; thứ tự nguyện vọng vẫn giữ nguyên.</p>${body}
     <div class="row"><button data-act="hsStep" data-s="rank">Quay lại</button><button class="pri" data-act="hsStep" data-s="tests">Tiếp: bài kiểm tra</button></div>`}
  if(h.step==='tests'){const cand=S.sessions.flatMap(s=>(h.draft.prefs[s.id]||[]).map(id=>club(id)).filter(c=>c&&c.hasTest));const n=h.draft.tests.length;
    return `${hsSteps('tests')}<h1>Bài kiểm tra</h1><p class="muted">CLB Tuyển chọn có bài kiểm tra trên Google Forms; link hiện sau khi em gửi. Tick tối đa ${MAX_TEST} CLB em sẽ làm bài. <b>Không làm bài, hoặc dưới mốc điểm, thì em không được xét vào CLB đó</b> và phần mềm xét nguyện vọng tiếp theo.</p>
     ${cand.length>MAX_TEST||cand.some(c=>!h.draft.tests.includes(c.id))?`<p class="note">CLB Tuyển chọn em xếp nhưng chưa tick sẽ không được xét: ${cand.filter(c=>!h.draft.tests.includes(c.id)).map(c=>esc(c.name)).join(', ')||'—'}.</p>`:''}
     <section class="panel"><div class="row"><h2 style="flex:1">CLB Tuyển chọn trong nguyện vọng</h2><span class="chip ${n>=MAX_TEST?'off':'wait'} num">${n}/${MAX_TEST}</span></div>
     ${cand.length?`<div class="cards">${cand.map(c=>{const on=h.draft.tests.includes(c.id);return `<label class="card" style="flex-direction:row;align-items:center;cursor:pointer"><input type="checkbox" data-chg="hsTest" value="${c.id}" ${on?'checked':''} ${!on&&n>=MAX_TEST?'disabled':''} style="min-height:auto;width:22px;height:22px"><span class="body"><span class="name">${esc(c.name)}</span><span class="small muted">${esc(sess(c.sessionId)?.name)}</span></span></label>`}).join('')}</div>`:'<div class="empty">Nguyện vọng của em không có CLB Tuyển chọn nào. Em bấm tiếp.</div>'}</section>
     <div class="row"><button data-act="hsStep" data-s="medals">Quay lại</button><button class="pri" data-act="hsStep" data-s="review">Tiếp: xem lại</button></div>`}
  if(h.step==='review'){const any=S.sessions.some(s=>(h.draft.prefs[s.id]||[]).length);
    return `${hsSteps('review')}<h1>Xem lại và gửi</h1>${!any?'<p class="note">Em chưa chọn CLB nào. Gửi như vậy nghĩa là em không tham gia CLB nào học kỳ này.</p>':''}
     <section class="panel">${summary(h.draft,false)}</section>
     <div class="row"><button data-act="hsStep" data-s="tests">Quay lại</button><button class="pri" data-act="hsSubmit">Gửi nguyện vọng</button></div>`}
  if(h.step==='receipt'){const g=S.regs[st.id];
    return `<section class="panel"><h2>Đã gửi</h2><p>Mã biên nhận <span class="mono big">${g.code}</span> · lúc ${fmt(g.ts)}</p>${summary(g,true)}
     <p class="small muted">Em có thể đăng nhập lại để sửa trước hạn chót (${fmt(S.deadline[3])}). Máy sẽ tự thoát sau <span id="rcpt">30</span> giây.</p><button class="pri" data-act="logout">Xong, thoát</button></section>`}
  return '';
}
function summary(d,links){
  const rows=S.sessions.map(s=>{const a=d.prefs[s.id]||[];return `<tr><td>${esc(s.name)}</td><td>${a.length?a.map((id,i)=>{const k=medalOfClub(d,s.id,id);return `NV${i+1} ${esc(club(id)?.name)}${k?` <span class="chip m-${k}">${medalName(k)}</span>`:''}`}).join('<br>'):'<span class="muted">Không học buổi này</span>'}</td></tr>`}).join('');
  const t=d.tests.map(id=>club(id)).filter(Boolean);
  return `<div class="tbl"><table><thead><tr><th>Buổi</th><th>Nguyện vọng</th></tr></thead><tbody>${rows}</tbody></table></div>
   <h3>Bài kiểm tra (${t.length})</h3>${t.length?`<ul>${t.map(c=>`<li>${esc(c.name)}${links&&c.link?` — <a href="${esc(c.link)}" target="_blank" rel="noopener">làm bài thi</a>`:''}</li>`).join('')}</ul>`:'<p class="muted">Không làm bài kiểm tra nào.</p>'}`;
}

/* ---------- actions ---------- */
function logout(msg){V.authed=false;V.gv.user=null;V.gv.edit=null;V.gv.err=[];V.hs={step:'login',user:null,draft:null,tab:null,err:''};V.screen='home';V.tmp={};render();if(msg)toast(msg)}
const ACT={
  home(){if(V.screen==='hs'&&V.hs.user){logout();return}V.screen='home';render()},
  go(d){V.screen=d.s;V.tmp={};if(d.s==='gv'){V.gv.err=[]}if(d.s==='hs'){V.hs.err=''}render()},
  logout(){logout()},
  modalYes(){const f=V.onYes;V.modal=null;V.onYes=null;renderOverlay();f&&f()},
  modalNo(){V.modal=null;V.onYes=null;renderOverlay()},
  reseed(d){ask('Đặt lại dữ liệu mẫu?',`<p>Mọi thay đổi hiện tại sẽ mất và nạp bộ "${d.k==='ca'?'Cả trường (798 học sinh, 40 CLB)':'Demo nhỏ (30 học sinh, 10 CLB)'}".</p>`,'Đặt lại',()=>{seed(d.k);V.tmp={};render();toast('Đã nạp dữ liệu mẫu.')},true)},
  tab(d){V.tab=d.t;V.tmp={};render()},
  sub(d){V.sub[d.t]=d.k;V.tmp={};render()},
  goto(d){V.tab=d.t;if(d.k)V.sub[d.t]=d.k;V.tmp={};render()},
  openPhase(d){const p=Number(d.p), dl=fromInput($('dl')?.value);if(!dl||dl<=Date.now()){toast('Chọn hạn chót ở tương lai.');return}
    S.deadline[p]=dl;setPhase(p,'Quản lý',`Mở "${PH[p]}", hạn ${fmt(dl)}`);render();toast(`Đã mở ${PH[p]}.`)},
  extend(d){S.deadline[S.phase]=Math.max(S.deadline[S.phase],Date.now())+Number(d.h)*3600e3;log('Quản lý',`Gia hạn "${PH[S.phase]}" đến ${fmt(S.deadline[S.phase])}.`);save();render();toast('Đã gia hạn.')},
  closeNow(){const p=S.phase;ask(`Đóng "${PH[p]}" ngay?`,`<p>${p===1?'Giáo viên không đăng ký hay sửa CLB được nữa. Chuyển sang Duyệt CLB.':'Học sinh không gửi hay sửa nguyện vọng được nữa. Chuyển sang Nhập điểm.'}</p>`,'Đóng ngay',()=>{setPhase(p+1,'Quản lý','Đóng sớm');render()})},
  back(){const p=S.phase;const reopen=p-1===1||p-1===3;
    ask(`Lùi về "${PH[p-1]}"?`,`<p>${reopen?`Giai đoạn "${PH[p-1]}" mở lại với hạn chót mới là 1 ngày nữa (gia hạn hoặc đóng ngay được).`:''}${p===5?' Điểm được mở khoá để sửa; lần chốt sau tạo phiên bản xuất mới.':''} Việc này ghi vào nhật ký.</p>`,'Lùi lại',()=>{if(reopen)S.deadline[p-1]=Date.now()+864e5;setPhase(p-1,'Quản lý','Lùi giai đoạn');V.tab='bayGio';render()})},
  lockScores(){const m=missingScores().length;ask('Chốt điểm?',`<p>${m?`<b>${m}</b> bài kiểm tra chưa có điểm sẽ tính là không làm bài: em đó không được xét vào CLB Tuyển chọn ấy. `:''}Sau khi chốt, sổ nhập được tạo phiên bản <b>v${S.exportVer+1}</b>.</p>`,'Chốt điểm',()=>{S.exportVer++;setPhase(5,'Quản lý',`Chốt điểm (v${S.exportVer}, ${m} bài không điểm)`);V.tab='bayGio';render()})},
  fakeApprove(){let n=0;S.clubs.forEach(c=>{if(c.status==='cho'){c.status='duyet';n++}});log('Công cụ thử',`Duyệt nhanh ${n} CLB.`);save();render();toast(`Đã duyệt ${n} CLB.`)},
  fakeRegs(){const r=rng(Date.now()&0xffff);let n=0;
    for(const s of S.students){if(S.regs[s.id]||r()>0.7)continue;const prefs={};
      S.sessions.forEach(se=>{if(r()<0.65){const el=eligible(s,se.id).sort(()=>r()-.5);const k=Math.min(el.length,1+Math.floor(r()*5));if(k)prefs[se.id]=el.slice(0,k).map(c=>c.id)}});
      const withTest=Object.values(prefs).flat().filter(id=>club(id).hasTest).filter(()=>r()<0.6).slice(0,MAX_TEST);
      S.regs[s.id]={prefs,tests:withTest,ts:Date.now(),code:mkCode()};n++}
    log('Công cụ thử',`Điền nguyện vọng giả cho ${n} học sinh.`);save();render();toast(`Đã điền cho ${n} em.`)},
  fakeScores(){const r=rng(Date.now()&0xffff);let n=0;for(const sid in S.regs)for(const cid of S.regs[sid].tests){if(S.scores[cid]?.[sid]!=null||r()>0.85)continue;(S.scores[cid]=S.scores[cid]||{})[sid]=Math.round(r()*100)/10;n++}
    log('Công cụ thử',`Điền ${n} điểm giả.`);save();render();toast(`Đã điền ${n} điểm.`)},
  sessDel(d){S.sessions=S.sessions.filter(s=>s.id!==d.id);log('Quản lý','Xoá một buổi.');save();render()},
  roomDel(d){const r=room(d.id);ask(`Xoá phòng ${r.name}?`,'<p>Phòng không có CLB nào nên xoá được.</p>','Xoá',()=>{S.rooms=S.rooms.filter(x=>x.id!==d.id);log('Quản lý',`Xoá phòng ${r.name}.`);save();render()},true)},
  stuPreview(){V.tmp.stuTxt=$('stuTxt').value;V.tmp.stuDone='';V.tmp.stuPrev=V.tmp.stuTxt.trim()?parseStudentText(V.tmp.stuTxt):null;if(!V.tmp.stuPrev){V.tmp.stuOpen=true;toast('Dán ít nhất một dòng trước.')}render()},
  stuSave(){const pv=V.tmp.stuPrev, mode=V.tmp.stuMode||'them';if(!pv)return;
    const r=rng(Date.now()&0xffff), newPin=()=>String(Math.floor(r()*1e4)).padStart(4,'0'), ok=pv.rows.filter(x=>x.kind!=='loi');
    if(mode==='them'){const added=[];let up=0;
      ok.forEach(x=>{const o=S.students.find(s=>s.id.toUpperCase()===x.id.toUpperCase());if(o){o.name=x.name;o.lop=x.lop;o.khoi=x.khoi;up++}else{const st={id:x.id,name:x.name,lop:x.lop,khoi:x.khoi,pin:newPin()};S.students.push(st);added.push(st)}});
      log('Quản lý',`Thêm ${added.length} học sinh, cập nhật ${up} em${pv.errs.length?`, bỏ qua ${pv.errs.length} dòng lỗi`:''}.`);
      V.tmp={stuMode:'them',cls:ok[0]?.lop,hl:ok.map(x=>x.id),stuDone:`${added.length?`Đã thêm ${added.length} em: `+added.slice(0,8).map(s=>`<span class="mono">${esc(s.id)}</span> ${esc(s.name)} (${esc(s.lop)}) · PIN <b class="mono">${s.pin}</b>`).join('; ')+(added.length>8?'…':''):''}${up?` Đã cập nhật ${up} em (giữ PIN).`:''}`};save();render();return}
    if(pv.errs.length)return;
    ask('Thay cả danh sách học sinh?',`<p>Danh sách mới có <b>${pv.rows.length}</b> em, thay cho <b>${S.students.length}</b> em hiện có. Em không có tên trong danh sách mới bị xoá cùng nguyện vọng. Mã đã có giữ nguyên PIN.</p>`,'Thay danh sách',()=>{
      const old=new Map(S.students.map(s=>[s.id.toUpperCase(),s]));
      S.students=pv.rows.map(x=>{const o=old.get(x.id.toUpperCase());return {id:x.id,name:x.name,lop:x.lop,khoi:x.khoi,pin:o?o.pin:newPin()}});
      const ids=new Set(S.students.map(s=>s.id));for(const k in S.regs)if(!ids.has(k))delete S.regs[k];
      log('Quản lý',`Thay danh sách: ${S.students.length} học sinh.`);V.tmp={stuDone:`Đã thay danh sách: ${S.students.length} em.`};save();render()},true)},
  gvPreview(){const t=$('gvTxt').value;V.tmp.gvTxt=t;V.tmp.gvMade=null;const seen=new Set(), have=new Set(S.teachers.map(x=>norm(x.name)));

  pasteScores(){const cid=V.tmp.sc&&club(V.tmp.sc)?V.tmp.sc:S.clubs.find(c=>c.status==='duyet'&&c.hasTest)?.id;const txt=$('pasteTxt').value;const res={ok:0,bad:[]};

  sessAdd(){const n=$('sn').value.trim();if(!n)return;if(S.sessions.some(s=>norm(s.name)===norm(n))){toast('Buổi này đã có.');return}const id='B'+Date.now().toString(36);S.sessions.push({id,name:n});log('Quản lý',`Thêm buổi ${n}.`);save();render()},

  roomAdd(){const n=$('rn').value.trim(), c=Number($('rc').value);if(S.rooms.some(r=>norm(r.name)===norm(n))){toast('Tên phòng đã có.');return}if(!Number.isInteger(c)||c<1){toast('Sức chứa là số nguyên từ 1.');return}

  gvSignup(){const code=$('g_code').value.trim(), name=$('g_name').value.trim(), pin=$('g_pin').value.trim(), pin2=$('g_pin2').value.trim();const e=[];

  gvLogin(){const name=$('g_name').value, pin=$('g_pin').value.trim();const t=S.teachers.find(x=>norm(x.name)===norm(name));

const CHG={
  sessName(el){const n=el.value.trim();const s=sess(el.dataset.id);if(!n||S.sessions.some(x=>x.id!==s.id&&norm(x.name)===norm(n))){toast('Tên buổi trống hoặc trùng.');render();return}s.name=n;log('Quản lý',`Đổi tên buổi thành ${n}.`);save();render()},
  roomName(el){const r=room(el.dataset.id), n=el.value.trim();if(!n||S.rooms.some(x=>x.id!==r.id&&norm(x.name)===norm(n))){toast('Tên phòng trống hoặc trùng.');render();return}r.name=n;log('Quản lý',`Đổi tên phòng thành ${n}.`);save();render()},
  roomCap(el){const r=room(el.dataset.id), c=Number(el.value);if(!Number.isInteger(c)||c<1){toast('Sức chứa là số nguyên từ 1.');render();return}

  dRoom(el){const c=club(el.dataset.id), r=room(el.value);if(roomTaken(r.id,c.sessionId,c.id)){V.tmp.dErr=`Phòng ${esc(r.name)} đã có CLB khác ở buổi này.`;render();return}
    if(!isFree(c)&&eq(c)>r.cap){V.tmp.dErr=`${esc(c.name)} nhận ${eq(c)} em, phòng ${esc(r.name)} chỉ chứa ${r.cap}. Giảm chỉ tiêu trước.`;render();return}
    const old=room(c.roomId)?.name;c.roomId=r.id;if(isFree(c))c.quota=r.cap;log('Quản lý',`Đổi phòng ${c.name}: ${old} → ${r.name}.`);V.tmp.dErr='';save();render()},
  dQuota(el){const c=club(el.dataset.id), v=el.value.trim(), r=room(c.roomId);
    if(v===''){if(S.phase>=3&&c.quota<eq(c)){V.tmp.dErr='Học sinh đã đăng ký: không giảm chỉ tiêu được.';render();return}c.adminQuota=null;log('Quản lý',`${c.name}: dùng lại chỉ tiêu GV (${c.quota}).`);V.tmp.dErr='';save();render();return}

document.addEventListener('change',e=>{if(rendering)return;const t=e.target.closest('[data-chg]');if(!t)return;const f=CHG[t.dataset.chg];deferRender=ptrDown;f&&f(t);if(!ptrDown)deferRender=false});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&V.modal)ACT.modalNo()});
['pointerdown','keydown','input'].forEach(ev=>document.addEventListener(ev,()=>{V.lastAct=Date.now()},true));

/* ---------- idle + clock ---------- */
setInterval(()=>{
  const role=V.screen==='hs'&&V.hs.user?'hs':V.screen==='gv'&&V.gv.user?'gv':V.screen==='admin'&&V.authed?'admin':null;
  const el=$('idle');
  if(role==='hs'&&V.hs.step==='receipt'){const left=30-Math.floor((Date.now()-V.hs.rcptAt)/1000);const r=$('rcpt');if(r)r.textContent=Math.max(0,left);if(left<=0){logout('Đã tự thoát sau khi gửi.');return}}
  if(!role){if(el)el.textContent='';return}
  const left=IDLE[role]-Math.floor((Date.now()-V.lastAct)/1000);
  if(left<=0){logout(role==='admin'?'Đã khoá quản lý vì không thao tác.':'Đã tự thoát vì không thao tác.');return}
  if(el)el.textContent=left<=20?`Tự thoát sau ${left} giây`:'';
},1000);
setInterval(tick,30000);
function pull(){try{const t=localStorage.getItem(KEY);if(!t)return;const o=JSON.parse(t);if(o&&o.v===2&&JSON.stringify(o)!==JSON.stringify(S)){S=o;render()}}catch(e){}}
window.addEventListener('storage',e=>{if(e.key===KEY)pull()});
window.addEventListener('focus',pull);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
setInterval(()=>{if(!rendering&&!ptrDown&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))pull()},3000);
load();tick();render();
</script>
