<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2002" width="1200" height="2002" role="img" aria-label="Sơ đồ luồng xử lý một lần chạy xếp câu lạc bộ, gồm các điểm quyết định và nhánh không đủ chỗ (dữ liệu mô phỏng)">
<defs><marker id="mui" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect x="0" y="0" width="1200" height="2002" fill="#ffffff"/>
<text x="40" y="40" font-family="sans-serif" font-size="20" font-weight="700" fill="#0f172a">Luồng xử lý của một lần chạy xếp (dữ liệu mô phỏng)</text>
<rect x="190" y="792" width="970" height="630" rx="14" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 5"/>
<rect x="260" y="70" width="420" height="78" rx="9" fill="#dbeafe" stroke="#334155" stroke-width="1.5"/>
<text x="470" y="92" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Đầu vào</text>
<text x="470" y="110" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">Sổ nhập CLB (Excel) hoặc CSV nội bộ</text>
<text x="470" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">CLB + chỉ tiêu; học sinh + nguyện vọng + điểm thi</text>
<polygon points="470,182 620,223 470,264 320,223" fill="#fef3c7" stroke="#334155" stroke-width="1.5"/>
<text x="470" y="218" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Mỗi dòng hợp lệ?</text>
<text x="470" y="236" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">(xem_truoc_so_nhap)</text>
<rect x="790" y="186" width="300" height="60" rx="9" fill="#fee2e2" stroke="#334155" stroke-width="1.5"/>
<text x="940" y="208" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Báo lỗi theo dòng</text>
<text x="940" y="226" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">Không nạp gì cả; sửa tệp rồi nạp lại</text>
<rect x="260" y="298" width="420" height="60" rx="9" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/>
<text x="470" y="320" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Sao lưu app.db (_backup_db)</text>
<text x="470" y="338" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">CSDL đang bận hoặc không sao lưu được: dừng ngay</text>
<polygon points="470,392 640,433 470,474 300,433" fill="#fef3c7" stroke="#334155" stroke-width="1.5"/>
<text x="470" y="428" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Dữ liệu đủ và nhất quán?</text>
<text x="470" y="446" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">(validate_data_integrity)</text>
<rect x="790" y="396" width="300" height="60" rx="9" fill="#fee2e2" stroke="#334155" stroke-width="1.5"/>
<text x="940" y="418" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Dừng, nêu rõ học sinh nào</text>
<text x="940" y="436" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">Dữ liệu không đổi</text>
<rect x="260" y="508" width="420" height="114" rx="9" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/>
<text x="470" y="530" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Khoá bốc thăm STB (generate_stb_lottery)</text>
<text x="470" y="548" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">Một số cho mỗi học sinh, dùng chung mọi CLB</text>
<text x="470" y="566" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">Lần đầu bốc; sau đó khoá và dùng lại đúng số cũ</text>
<text x="470" y="584" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">Em đến muộn: chèn ngẫu nhiên, giữ thứ tự cũ</text>
<text x="470" y="602" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">(chen_stb_cho_hoc_sinh_moi)</text>
<rect x="260" y="656" width="420" height="96" rx="9" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/>
<text x="470" y="678" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Thứ tự ưu tiên của từng CLB (compute_club_priority)</text>
<text x="470" y="696" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">Tầng 1 đã thi: điểm giảm dần, hoà thì theo số bốc thăm</text>
<text x="470" y="714" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">Tầng 2 không thi: chỉ theo số bốc thăm</text>
<text x="470" y="732" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">Không đọc thứ hạng nguyện vọng của học sinh</text>
<polyline points="470,148 470,182" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#mui)"/>
<polyline points="470,264 470,298" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#mui)"/>
<text x="476" y="276" font-family="sans-serif" font-size="12" font-weight="700" fill="#475569">Có</text>
<polyline points="470,358 470,392" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#mui)"/>
<polyline points="470,474 470,508" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#mui)"/>
<text x="476" y="486" font-family="sans-serif" font-size="12" font-weight="700" fill="#475569">Có</text>
<polyline points="470,622 470,656" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#mui)"/>
<polyline points="620,223 790,223" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#mui)"/>
<text x="626" y="217" font-family="sans-serif" font-size="12" font-weight="700" fill="#475569">Không</text>
<polyline points="640,433 790,433" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#mui)"/>
<text x="646" y="427" font-family="sans-serif" font-size="12" font-weight="700" fill="#475569">Không</text>
<text x="1140" y="814" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f172a">Vòng lặp Deferred Acceptance (run_rbda): học sinh đề xuất, CLB giữ tạm</text>
<rect x="260" y="834" width="420" height="60" rx="9" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/>
<text x="470" y="856" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Mỗi học sinh chưa có chỗ</text>
<text x="470" y="874" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">đề xuất vào nguyện vọng kế tiếp của mình</text>
<rect x="260" y="924" width="420" height="60" rx="9" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/>
<text x="470" y="946" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Mỗi CLB có người mới nộp: gộp</text>
<text x="470" y="964" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">người đang giữ tạm + người mới</text>
<rect x="260" y="1014" width="420" height="78" rx="9" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/>
<text x="470" y="1036" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Hàm lựa chọn của CLB (club_choice_function)</text>
<text x="470" y="1054" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">Lượt dự trữ mềm, rồi lượt chung</text>
<text x="470" y="1072" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">Giữ tối đa bằng chỉ tiêu (capacity)</text>
<polygon points="470,1122 630,1154 470,1186 310,1154" fill="#fef3c7" stroke="#334155" stroke-width="1.5"/>
<text x="470" y="1158" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Em nằm trong số được giữ?</text>
<rect x="260" y="1220" width="420" height="60" rx="9" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/>
<text x="470" y="1242" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">CLB giữ tạm em này</text>
<text x="470" y="1260" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">(chưa chốt: vòng sau có thể bị người khác đẩy ra)</text>
<polygon points="470,1310 670,1351 470,1392 270,1351" fill="#fef3c7" stroke="#334155" stroke-width="1.5"/>
<text x="470" y="1346" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Còn em chưa có chỗ</text>
<text x="470" y="1364" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">mà còn nguyện vọng chưa thử?</text>
<rect x="790" y="1116" width="300" height="78" rx="9" fill="#ffedd5" stroke="#334155" stroke-width="1.5"/>
<text x="940" y="1138" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">NHÁNH KHÔNG ĐỦ CHỖ</text>
<text x="940" y="1156" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">CLB đã đủ chỉ tiêu: em xếp sau bị từ chối</text>
<text x="940" y="1174" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">Em thử nguyện vọng kế tiếp ở vòng sau</text>
<rect x="790" y="1230" width="300" height="78" rx="9" fill="#fee2e2" stroke="#334155" stroke-width="1.5"/>
<text x="940" y="1252" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Hết nguyện vọng vẫn bị từ chối</text>
<text x="940" y="1270" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">Kết quả: Chưa có chỗ</text>
<text x="940" y="1288" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">Có trang riêng trong tệp Excel kết quả</text>
<polyline points="470,894 470,924" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#mui)"/>
<polyline points="470,984 470,1014" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#mui)"/>
<polyline points="470,1092 470,1122" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#mui)"/>
<polyline points="470,1280 470,1310" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#mui)"/>
<polyline points="470,1186 470,1220" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#mui)"/>
<text x="476" y="1198" font-family="sans-serif" font-size="12" font-weight="700" fill="#475569">Có</text>
<polyline points="630,1154 790,1154" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#mui)"/>
<text x="636" y="1148" font-family="sans-serif" font-size="12" font-weight="700" fill="#475569">Không</text>
<polyline points="940,1194 940,1230" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#mui)"/>
<text x="946" y="1220" font-family="sans-serif" font-size="12" font-weight="700" fill="#475569">hết nguyện vọng</text>
<polyline points="790,1146 764,1146 764,1351 670,1351" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#mui)"/>
<text x="770" y="1323" font-family="sans-serif" font-size="12" font-weight="700" fill="#475569">vòng sau</text>
<polyline points="270,1351 224,1351 224,864 260,864" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#mui)"/>
<text x="230" y="1341" font-family="sans-serif" font-size="12" font-weight="700" fill="#475569">Có: vòng kế</text>
<polyline points="470,752 470,834" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#mui)"/>
<polygon points="470,1458 660,1499 470,1540 280,1499" fill="#fef3c7" stroke="#334155" stroke-width="1.5"/>
<text x="470" y="1494" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Không có cặp học sinh–CLB phá vỡ?</text>
<text x="470" y="1512" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">(verify_stability, dùng chính hàm lựa chọn)</text>
<rect x="790" y="1464" width="300" height="60" rx="9" fill="#fee2e2" stroke="#334155" stroke-width="1.5"/>
<text x="940" y="1486" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Dừng, không ghi kết quả</text>
<text x="940" y="1504" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">Báo cặp phá vỡ</text>
<rect x="260" y="1574" width="420" height="78" rx="9" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/>
<text x="470" y="1596" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Ghi match_results và run_history</text>
<text x="470" y="1614" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">trong MỘT giao dịch; lỗi thì quay về như trước</text>
<text x="470" y="1632" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">run_history chỉ thêm dòng, không sửa, không xoá</text>
<rect x="260" y="1686" width="420" height="60" rx="9" fill="#ede9fe" stroke="#334155" stroke-width="1.5"/>
<text x="470" y="1708" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Xuất CSV và Excel; tra cứu từng học sinh</text>
<text x="470" y="1726" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">Giải thích kết quả, phiếu in, khiếu nại</text>
<polyline points="470,1422 470,1458" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#mui)"/>
<text x="476" y="1436" font-family="sans-serif" font-size="12" font-weight="700" fill="#475569">Không còn ai</text>
<polyline points="470,1540 470,1574" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#mui)"/>
<text x="476" y="1552" font-family="sans-serif" font-size="12" font-weight="700" fill="#475569">Có</text>
<polyline points="470,1652 470,1686" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#mui)"/>
<polyline points="660,1499 790,1499" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#mui)"/>
<text x="666" y="1493" font-family="sans-serif" font-size="12" font-weight="700" fill="#475569">Không</text>
<rect x="40" y="1796" width="1120" height="150" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.2"/>
<text x="60" y="1824" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Khi không đủ chỗ: phần mềm làm gì</text>
<text x="60" y="1842" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">1. CLB đủ chỉ tiêu: các em được giữ theo thứ tự ưu tiên của CLB đó; em còn lại thử nguyện vọng kế tiếp.</text>
<text x="60" y="1860" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">2. Hết danh sách nguyện vọng mà vẫn bị từ chối: ghi 'Chưa có chỗ' và liệt kê riêng, không xếp ngẫu nhiên vào CLB khác.</text>
<text x="60" y="1878" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">3. Suất dự trữ mềm không khoá cứng: không đủ em thuộc diện thì suất thừa chuyển sang lượt chung, CLB vẫn tuyển đủ.</text>
<text x="60" y="1896" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">4. Chế độ FA-DAA (tuỳ chọn theo workspace): đóng CLB thiếu thành viên tối thiểu, danh sách chờ khi có suất nhả ra,</text>
<text x="60" y="1914" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">    vòng 2 cho em chưa có CLB chọn vào chỗ còn trống, CLB Tự do không giới hạn chỉ tiêu.</text>
<text x="60" y="1932" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f172a">Toàn bộ là thuật toán xác định: cùng dữ liệu và cùng hạt giống thì cùng kết quả. Không có mô hình học máy ở bước nào.</text>
<rect x="40" y="1958" width="18" height="18" rx="4" fill="#dbeafe" stroke="#334155"/>
<text x="66" y="1972" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="400" fill="#0f172a">Đầu vào</text>
<rect x="153" y="1958" width="18" height="18" rx="4" fill="#fef3c7" stroke="#334155"/>
<text x="179" y="1972" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="400" fill="#0f172a">Kiểm tra / quyết định</text>
<rect x="392" y="1958" width="18" height="18" rx="4" fill="#dcfce7" stroke="#334155"/>
<text x="418" y="1972" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="400" fill="#0f172a">Xử lý</text>
<rect x="487" y="1958" width="18" height="18" rx="4" fill="#ffedd5" stroke="#334155"/>
<text x="513" y="1972" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="400" fill="#0f172a">Nhánh không đủ chỗ</text>
<rect x="699" y="1958" width="18" height="18" rx="4" fill="#fee2e2" stroke="#334155"/>
<text x="725" y="1972" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="400" fill="#0f172a">Dừng hoặc báo lỗi</text>
<rect x="902" y="1958" width="18" height="18" rx="4" fill="#ede9fe" stroke="#334155"/>
<text x="928" y="1972" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="400" fill="#0f172a">Đầu ra</text>
</svg>
