name: Tests (rbda-kiosk)

# Chay TU DONG o moi lan day code va moi pull request. Truoc day bo test chi
# chay khi ai do bam tay de build ban phat hanh — loi lot vao nhanh chinh ma
# khong ai biet cho toi luc dong goi.
on:
  push:
  pull_request:

# Chi doc ma nguon. Job nay khong dang gi len GitHub.
permissions:
  contents: read

# Commit moi tren cung nhanh huy luot dang chay cua commit cu (khong ton
# 40 phut cho ket qua ai cung bo qua). Tach theo loai su kien (push / PR) de
# hai luot cua cung mot commit khong huy lan nhau. Nhanh main khong huy:
# moi commit tren main deu can ket qua day du.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.6,<1"
      - run: ruff check .

  # Bo test chia 4 phan chay song song (.github/chia_test.py, chia tat dinh theo kich thuoc tep):
  # truoc day mot may chay noi tiep 51-73 phut. Moi phan ghi do phu rieng; job "do-phu" gop lai.
  test-linux:
    name: Bo test day du + giao dien that (Linux ${{ matrix.phan }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        phan: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cai goi
        run: pip install -r requirements-dev.txt
      # Test giao dien chay trinh duyet THAT. Khong co Chromium thi chung tu
      # bo qua va bo test van xanh — nen phai cai that o day, khong thi CI
      # xanh ma khong kiem gi ve giao dien.
      - name: Cai Chromium cho Playwright
        run: python -m playwright install --with-deps chromium
      # Chay lai TRUOC cac test hong o lan chay truoc cua nhanh nay: biet ban sua dung chua sau vai phut.
      - name: Lay danh sach test hong lan truoc
        uses: actions/cache@v4
        with:
          path: .pytest_cache
          key: pytest-lf-${{ github.head_ref || github.ref_name }}-${{ matrix.phan }}-${{ github.run_id }}
          restore-keys: pytest-lf-${{ github.head_ref || github.ref_name }}-${{ matrix.phan }}-
      - name: Chay lai test hong lan truoc (nhanh)
        run: |
          # Chi chay khi danh sach test hong cu CO tep thuoc phan nay. Truoc day: khi cac test hong cu
          # khong nam trong phan nay, pytest --lf chay LAI CA PHAN (mat 8-16 phut moi lan, vo ich).
          TEP=$(python .github/chia_test.py ${{ matrix.phan }} 4)
          HONG=$(python .github/test_hong_cu.py $TEP)
          if [ -z "$HONG" ]; then echo "Khong co test hong cu trong phan nay: bo qua"; exit 0; fi
          # exit 5 = khong co test nao de chay lai: bo qua
          python -m pytest -q --lf --lfnf=none $HONG || [ $? -eq 5 ]
      - name: Chay test (kem do phu)
        env:
          COVERAGE_FILE: .coverage.phan${{ matrix.phan }}
        run: python -m pytest -q --cov --cov-report= --cov-fail-under=0 $(python .github/chia_test.py ${{ matrix.phan }} 4)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: do-phu-${{ matrix.phan }}
          path: .coverage.phan${{ matrix.phan }}
          include-hidden-files: true
      # Chan truong hop Chromium cai hong ma test giao dien lang le bo qua.
      - name: Soat khong co test giao dien nao bi bo qua
        if: matrix.phan == 1
        run: |
          python -m pytest -q -rs tests/test_giao_dien_upload.py > ket_qua.txt || true
          cat ket_qua.txt
          if grep -q "SKIPPED" ket_qua.txt; then
            echo "::error::Test giao dien bi bo qua — Chromium khong chay duoc tren CI"
            exit 1
          fi

  do-phu:
    name: Do phu gop (>= 85 %)
    needs: test-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "coverage[toml]>=7"
      - uses: actions/download-artifact@v4
        with:
          pattern: do-phu-*
          merge-multiple: true
      - run: |
          python -m coverage combine .coverage.phan*
          python -m coverage report

  test-windows:
    name: Bo test (Windows ${{ matrix.phan }}/4)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        phan: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Khong cai playwright tren Windows: test giao dien da chay o Linux.
      # O day bat loai loi CHI Windows moi co: duong dan gach nguoc, tep
      # mo chua dong nen khong xoa duoc, ten tep danh rieng (CON, NUL...).
      - name: Cai goi
        run: |
          pip install -r requirements.txt
          # python-docx: các test sinh tệp Forms (.docx) chạy THẬT trên Windows (PR #14, Truong chọn), không bỏ qua
          pip install "pytest>=8.0,<10" "pillow>=10.0,<13" "python-docx>=1.1,<2"
      - name: Chay test
        shell: bash
        run: python -m pytest -q $(python .github/chia_test.py ${{ matrix.phan }} 4)
